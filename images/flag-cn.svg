<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 20" role="img" aria-label="中文">
  <!-- 오성홍기 — 중국 국기 표준(GB 12982)의 도형 비율.
       규격이 원래 가로 30 × 세로 20 격자로 정의되어 있어 viewBox 를 그대로 쓴다.
       · 큰 별  : 중심 (5,5),  외접원 반지름 3
       · 작은 별: 중심 (10,2) (12,4) (12,7) (10,9), 외접원 반지름 1
       · 작은 별은 각각 꼭짓점 하나가 큰 별의 중심(5,5)을 향하도록 회전시킨다.
         (아래 rotate 값은 그 방향을 계산해 넣은 것) -->
  <rect width="30" height="20" fill="#de2910"/>
  <!-- 별 하나의 기본형: 외접원 반지름 1, 꼭짓점 하나가 위(0,-1)를 향한다 -->
  <g fill="#ffde00">
      <polygon transform="translate(5,5) scale(3)"
               points="0,-1 0.2245,-0.309 0.9511,-0.309 0.3633,0.118 0.5878,0.809 0,0.382 -0.5878,0.809 -0.3633,0.118 -0.9511,-0.309 -0.2245,-0.309"/>
      <polygon transform="translate(10,2) rotate(-120.96)"
               points="0,-1 0.2245,-0.309 0.9511,-0.309 0.3633,0.118 0.5878,0.809 0,0.382 -0.5878,0.809 -0.3633,0.118 -0.9511,-0.309 -0.2245,-0.309"/>
      <polygon transform="translate(12,4) rotate(-98.13)"
               points="0,-1 0.2245,-0.309 0.9511,-0.309 0.3633,0.118 0.5878,0.809 0,0.382 -0.5878,0.809 -0.3633,0.118 -0.9511,-0.309 -0.2245,-0.309"/>
      <polygon transform="translate(12,7) rotate(-74.05)"
               points="0,-1 0.2245,-0.309 0.9511,-0.309 0.3633,0.118 0.5878,0.809 0,0.382 -0.5878,0.809 -0.3633,0.118 -0.9511,-0.309 -0.2245,-0.309"/>
      <polygon transform="translate(10,9) rotate(-51.34)"
               points="0,-1 0.2245,-0.309 0.9511,-0.309 0.3633,0.118 0.5878,0.809 0,0.382 -0.5878,0.809 -0.3633,0.118 -0.9511,-0.309 -0.2245,-0.309"/>
  </g>
</svg>
